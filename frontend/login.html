<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Login | Klinik Hewan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        body {
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="auth-header">
            <ion-icon name="paw" class="brand-icon"></ion-icon>
            <h2 style="font-size:1.5rem; font-weight:700; color:var(--text-main);">VetKlinik Login</h2>
            <p style="color:var(--text-muted);">Masuk untuk mengelola data hewan</p>
        </div>

        <form onsubmit="handleLogin(event)">
            <div style="margin-bottom:1rem;">
                <label>Email</label>
                <input type="email" id="email" required placeholder="nama@email.com">
            </div>

            <div style="margin-bottom:1.5rem;">
                <label>Password</label>
                <input type="password" id="password" required placeholder="********">
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.875rem;">Masuk</button>
        </form>

        <div style="text-align:center; margin-top:1.5rem; font-size:0.875rem; color:var(--text-muted);">
            Belum punya akun? <a href="register.html" style="font-weight:600;">Daftar di sini</a>
        </div>
    </div>

    <script>
        const API = "http://localhost:3000/api";

        // Auto redirect if already logged in
        if (localStorage.getItem("token")) window.location.href = "dashboard.html";

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("user", JSON.stringify(data.user));

                    // If user has an API Key, we could fetch and store it here too potentially
                    // But let's stick to standard flow
                    window.location.href = "dashboard.html";
                } else {
                    alert(data.message || "Login gagal");
                }
            } catch (err) {
                alert("Gagal terhubung ke server");
            }
        }
    </script>

</body>

</html>
