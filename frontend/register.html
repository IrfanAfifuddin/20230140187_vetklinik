<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Daftar | Klinik Hewan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <style>
        body {
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-card {
            background: white;
            padding: 2.5rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
    </style>
</head>

<body>

    <div class="auth-card">
        <div class="auth-header">
            <h2 style="font-size:1.5rem; font-weight:700; color:var(--text-main);">Buat Akun Baru</h2>
            <p style="color:var(--text-muted);">Mulai kelola kesehatan hewan Anda</p>
        </div>

        <form onsubmit="handleRegister(event)">
            <div style="margin-bottom:1rem;">
                <label>Nama Lengkap</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>

            <div style="margin-bottom:1rem;">
                <label>Email</label>
                <input type="email" id="email" required placeholder="nama@email.com">
            </div>

            <div style="margin-bottom:1.5rem;">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Minimal 6 karakter">
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%; padding:0.875rem;">Daftar Sekarang</button>
        </form>

        <div style="text-align:center; margin-top:1.5rem; font-size:0.875rem; color:var(--text-muted);">
            Sudah punya akun? <a href="login.html" style="font-weight:600;">Login di sini</a>
        </div>
    </div>

    <script>
        const API = "http://localhost:3000/api";

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (password.length < 6) return alert("Password minimal 6 karakter");

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alert("Registrasi berhasil! Silakan login.");
                    window.location.href = "login.html";
                } else {
                    alert(data.message || "Registrasi gagal");
                }
            } catch (err) {
                alert("Gagal terhubung ke server");
            }
        }
    </script>

</body>

</html>
